  <!-- Preload the two faces used above the fold. The third (mono) is used for

  <!-- The LCP element. It is rendered by React, so without this the browser
       cannot discover it until the JS bundle has parsed. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high"
    href="/img/portrait-400.avif"
    imagesrcset="/img/portrait-320.avif 320w, /img/portrait-400.avif 400w, /img/portrait-760.avif 760w"

  <!-- Declared here rather than in the stylesheet so the browser can start
       fetching before the CSS bundle arrives. Latin subset only; Geist Sans and
       Geist Mono are variable, so one file covers every weight used. -->
  <style>
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/geist-sans-var.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Geist Mono';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/geist-mono-var.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Instrument Serif';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/instrument-serif.woff2') format('woff2');
    }

    /* Paint the page background before the CSS bundle lands, so there is no
       white flash on a dark-mode load. */
    html { background: #fbfaf7; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme='light']) { background: #12110d; }
    }
  </style>

  <!-- Apply a saved theme override before first paint. React sets the same
       attribute, but not until the bundle has mounted — which means a reader whose
       system is dark and whose saved preference is light would watch the page load
       dark and then flip. Blocking, tiny, and deliberately before the stylesheet. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode: fall through to the system preference */ }
  </script>
